<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table - A-Level Chemistry</title>
<style>
:root {
  --bg: #0f0f1e;
  --bg2: #1a1a2e;
  --text: #f0f0f0;
  --text2: #aab;
  --border: rgba(255,255,255,0.1);
  --card-bg: rgba(255,255,255,0.05);
  --modal-bg: #16162a;
  --input-bg: rgba(255,255,255,0.08);
  --shadow: rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg: #f0f2f5;
  --bg2: #fff;
  --text: #1a1a2e;
  --text2: #555;
  --border: rgba(0,0,0,0.12);
  --card-bg: rgba(0,0,0,0.03);
  --modal-bg: #fff;
  --input-bg: rgba(0,0,0,0.06);
  --shadow: rgba(0,0,0,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--bg2); border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; }
.logo { font-size:22px; font-weight:800; background:linear-gradient(135deg,#a855f7,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.header-controls { display:flex; gap:10px; align-items:center; }
#search { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:14px; width:220px; outline:none; }
#search:focus { border-color:#a855f7; }
.btn { padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600; transition:all 0.2s; }
.btn-primary { background:linear-gradient(135deg,#a855f7,#6366f1); color:#fff; }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 15px rgba(168,85,247,0.4); }
.btn-secondary { background:var(--input-bg); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { background:rgba(255,255,255,0.15); }
.btn-secondary.active { background:linear-gradient(135deg,#a855f7,#6366f1); color:#fff; border-color:transparent; }
#controls { padding:10px 20px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--bg2); border-bottom:1px solid var(--border); }
#controls label { font-size:13px; color:var(--text2); margin-right:4px; }
#trend-select { padding:6px 10px; border-radius:6px; background:var(--input-bg); color:var(--text); border:1px solid var(--border); font-size:13px; }
.cat-filters { display:flex; gap:4px; flex-wrap:wrap; }
.cat-btn { padding:4px 10px; border-radius:6px; border:none; cursor:pointer; font-size:11px; font-weight:600; color:#fff; opacity:0.7; transition:all 0.2s; }
.cat-btn:hover,.cat-btn.active { opacity:1; transform:scale(1.05); }

/* Periodic Table Grid */
#table-container { padding:20px; overflow-x:auto; }
#periodic-table { display:grid; grid-template-columns:repeat(18,minmax(58px,1fr)); gap:3px; max-width:1200px; margin:0 auto; }
.element { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 2px; border-radius:8px; cursor:pointer; transition:all 0.25s; color:#fff; position:relative; min-height:70px; }
.element:hover { transform:scale(1.15); z-index:10; box-shadow:0 0 25px rgba(255,255,255,0.2); }
.element .z { font-size:9px; opacity:0.8; }
.element .sym { font-size:18px; font-weight:800; line-height:1.1; }
.element .name { font-size:7px; opacity:0.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.element .mass { font-size:7px; opacity:0.6; }
.element.dimmed { opacity:0.15; }
.element .exam-badge { position:absolute; top:2px; right:2px; font-size:7px; background:rgba(0,0,0,0.4); padding:1px 3px; border-radius:3px; }
.separator-label { grid-column:1/4; display:flex; align-items:center; font-size:11px; color:var(--text2); padding-left:4px; }

/* Category gradients */
.cat-alkali-metal { background:linear-gradient(135deg,#ff416c,#ff4b2b); }
.cat-alkaline-earth { background:linear-gradient(135deg,#f97316,#eab308); }
.cat-transition-metal { background:linear-gradient(135deg,#f59e0b,#ef4444); }
.cat-post-transition { background:linear-gradient(135deg,#10b981,#06b6d4); }
.cat-metalloid { background:linear-gradient(135deg,#14b8a6,#0ea5e9); }
.cat-nonmetal { background:linear-gradient(135deg,#06b6d4,#3b82f6); }
.cat-noble-gas { background:linear-gradient(135deg,#a855f7,#6366f1); }
.cat-lanthanide { background:linear-gradient(135deg,#ec4899,#f43f5e); }
.cat-actinide { background:linear-gradient(135deg,#f472b6,#a855f7); }
.cat-unknown { background:linear-gradient(135deg,#6b7280,#4b5563); }

/* Legend */
#legend { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 20px; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text2); }
.legend-swatch { width:14px; height:14px; border-radius:4px; }

/* Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; justify-content:center; align-items:center; backdrop-filter:blur(4px); }
.modal-overlay.active { display:flex; }
.modal { background:var(--modal-bg); border-radius:16px; max-width:700px; width:95%; max-height:85vh; overflow-y:auto; border:1px solid var(--border); box-shadow:0 20px 60px var(--shadow); }
.modal-header { display:flex; align-items:center; gap:16px; padding:20px 24px; border-bottom:1px solid var(--border); }
.modal-symbol { font-size:48px; font-weight:900; width:80px; height:80px; display:flex; align-items:center; justify-content:center; border-radius:12px; color:#fff; }
.modal-title h2 { font-size:24px; }
.modal-title .subtitle { color:var(--text2); font-size:14px; }
.modal-close { position:absolute; top:16px; right:20px; background:none; border:none; color:var(--text); font-size:24px; cursor:pointer; opacity:0.6; }
.modal-close:hover { opacity:1; }
.modal-tabs { display:flex; gap:4px; padding:12px 24px 0; border-bottom:1px solid var(--border); }
.modal-tab { padding:8px 16px; border:none; background:none; color:var(--text2); cursor:pointer; font-size:13px; font-weight:600; border-bottom:2px solid transparent; transition:all 0.2s; }
.modal-tab:hover { color:var(--text); }
.modal-tab.active { color:#a855f7; border-bottom-color:#a855f7; }
.modal-body { padding:20px 24px; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.prop-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.prop-item { padding:10px; background:var(--card-bg); border-radius:8px; border:1px solid var(--border); }
.prop-label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }
.prop-value { font-size:16px; font-weight:600; margin-top:2px; }
.prop-value.small { font-size:13px; }
.section-title { font-size:15px; font-weight:700; margin:16px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--border); }
.description-text { font-size:13px; line-height:1.6; color:var(--text2); }
.compound-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.compound-tag { padding:4px 10px; background:var(--input-bg); border-radius:6px; font-size:12px; font-weight:600; border:1px solid var(--border); }
.exam-relevance-bar { height:8px; border-radius:4px; background:var(--input-bg); margin-top:6px; overflow:hidden; }
.exam-relevance-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#10b981,#eab308,#ef4444); }

/* Atomic Diagram */
.atom-diagram-container { display:flex; flex-direction:column; align-items:center; margin:16px 0; padding:20px; background:var(--card-bg); border-radius:12px; border:1px solid var(--border); }
.atom-diagram-container h4 { font-size:14px; font-weight:700; margin-bottom:12px; color:var(--text); }
.atom-diagram-legend { display:flex; gap:16px; margin-top:12px; font-size:11px; color:var(--text2); flex-wrap:wrap; justify-content:center; }
.atom-diagram-legend span { display:flex; align-items:center; gap:4px; }
.atom-diagram-legend .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.shell-label-text { font-size:10px; fill:var(--text2); }

/* Quiz */
.quiz-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200; justify-content:center; align-items:center; backdrop-filter:blur(6px); }
.quiz-overlay.active { display:flex; }
.quiz-box { background:var(--modal-bg); border-radius:16px; max-width:600px; width:95%; padding:30px; border:1px solid var(--border); }
.quiz-progress { display:flex; justify-content:space-between; font-size:13px; color:var(--text2); margin-bottom:16px; }
.quiz-progress-bar { height:4px; background:var(--input-bg); border-radius:2px; margin-bottom:20px; overflow:hidden; }
.quiz-progress-fill { height:100%; background:linear-gradient(90deg,#a855f7,#06b6d4); border-radius:2px; transition:width 0.3s; }
.quiz-question { font-size:17px; font-weight:600; margin-bottom:20px; line-height:1.5; }
.quiz-topic { font-size:12px; color:var(--text2); margin-bottom:8px; padding:3px 10px; background:var(--input-bg); border-radius:4px; display:inline-block; }
.quiz-options { display:flex; flex-direction:column; gap:8px; }
.quiz-option { padding:12px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card-bg); cursor:pointer; font-size:14px; transition:all 0.2s; text-align:left; color:var(--text); }
.quiz-option:hover { border-color:#a855f7; background:rgba(168,85,247,0.1); }
.quiz-option.correct { border-color:#10b981; background:rgba(16,185,129,0.15); }
.quiz-option.wrong { border-color:#ef4444; background:rgba(239,68,68,0.15); }
.quiz-option.disabled { pointer-events:none; opacity:0.6; }
.quiz-explanation { margin-top:16px; padding:14px; background:rgba(168,85,247,0.08); border:1px solid rgba(168,85,247,0.2); border-radius:10px; font-size:13px; line-height:1.6; display:none; }
.quiz-explanation.show { display:block; }
.quiz-actions { margin-top:16px; display:flex; gap:8px; justify-content:flex-end; }
.quiz-score { text-align:center; padding:30px; }
.quiz-score h2 { font-size:28px; margin-bottom:8px; }
.quiz-score .score-num { font-size:56px; font-weight:900; background:linear-gradient(135deg,#a855f7,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

/* Trend bar chart */
#trend-chart { max-width:1200px; margin:10px auto; padding:0 20px; }
#trend-canvas { width:100%; height:180px; background:var(--card-bg); border-radius:10px; border:1px solid var(--border); }

/* Question list in modal */
.q-card { padding:14px; background:var(--card-bg); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; }
.q-card .q-text { font-size:14px; font-weight:600; margin-bottom:8px; }
.q-card .q-meta { font-size:11px; color:var(--text2); display:flex; gap:10px; margin-bottom:8px; }
.q-card .q-options { display:flex; flex-direction:column; gap:4px; }
.q-card .q-opt { font-size:13px; padding:6px 10px; border-radius:6px; cursor:pointer; border:1px solid var(--border); transition:all 0.2s; }
.q-card .q-opt:hover { border-color:#a855f7; }
.q-card .q-opt.reveal-correct { background:rgba(16,185,129,0.15); border-color:#10b981; }
.q-card .q-opt.reveal-wrong { background:rgba(239,68,68,0.1); border-color:#ef4444; }
.q-card .q-explanation { font-size:12px; color:var(--text2); margin-top:8px; padding:8px; background:var(--input-bg); border-radius:6px; display:none; }
.q-card .q-explanation.show { display:block; }
.prob-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; }
.prob-high { background:rgba(239,68,68,0.2); color:#f87171; }
.prob-med { background:rgba(234,179,8,0.2); color:#fbbf24; }
.prob-low { background:rgba(16,185,129,0.2); color:#34d399; }

/* Responsive */
@media(max-width:900px) {
  #periodic-table { grid-template-columns:repeat(18,minmax(36px,1fr)); gap:2px; }
  .element { padding:3px 1px; min-height:48px; border-radius:4px; }
  .element .sym { font-size:13px; }
  .element .name,.element .mass { display:none; }
  .prop-grid { grid-template-columns:1fr; }
}
@media(max-width:500px) {
  #periodic-table { grid-template-columns:repeat(18,minmax(24px,1fr)); gap:1px; }
  .element { min-height:34px; padding:2px; border-radius:3px; }
  .element .z { font-size:6px; }
  .element .sym { font-size:10px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">Periodic Table - A-Level Chemistry</div>
  <div class="header-controls">
    <input type="text" id="search" placeholder="Search element..." autocomplete="off">
    <button class="btn btn-secondary" onclick="toggleTheme()" id="theme-btn">Light Mode</button>
    <button class="btn btn-primary" onclick="startQuiz()">Quiz Mode</button>
  </div>
</header>
<div id="controls">
  <label>Filter:</label>
  <div class="cat-filters" id="cat-filters"></div>
  <label style="margin-left:12px">Trend:</label>
  <select id="trend-select" onchange="showTrend(this.value)">
    <option value="none">None</option>
    <option value="electronegativity">Electronegativity</option>
    <option value="ionization">1st Ionization Energy</option>
    <option value="atomicRadius">Atomic Radius</option>
    <option value="meltingPoint">Melting Point</option>
    <option value="density">Density</option>
    <option value="examRelevance">Exam Relevance</option>
  </select>
</div>
<div id="table-container">
  <div id="periodic-table"></div>
</div>
<div id="legend"></div>
<div id="trend-chart" style="display:none"><canvas id="trend-canvas"></canvas></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="element-modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-header" id="modal-header"></div>
    <div class="modal-tabs" id="modal-tabs">
      <button class="modal-tab active" onclick="switchTab('props',this)">Properties</button>
      <button class="modal-tab" onclick="switchTab('exam',this)">Exam Questions</button>
      <button class="modal-tab" onclick="switchTab('about',this)">About & Uses</button>
    </div>
    <div class="modal-body">
      <div class="tab-content active" id="tab-props"></div>
      <div class="tab-content" id="tab-exam"></div>
      <div class="tab-content" id="tab-about"></div>
    </div>
  </div>
</div>

<div class="quiz-overlay" id="quiz-overlay">
  <div class="quiz-box" id="quiz-box"></div>
</div>

<script>
const CATEGORIES = {

const ELEMENTS = [
{z:1,sym:"H",name:"Hydrogen",mass:1.008,cat:"nonmetal",group:1,period:1,block:"s",row:1,col:1,eConfig:"1s1",eShort:"1s1",en:2.20,ie:[1312,2372,0],ox:["-1","+1"],mp:-259.16,bp:-252.87,density:0.00009,state:"gas",radius:53,discovered:"1766",discoverer:"Henry Cavendish",props:"Lightest and most abundant element in the universe. Forms diatomic H2 molecules. Key role in acid-base chemistry as H+ ions. Burns in oxygen to form water. Used in Haber process for ammonia synthesis.",compounds:["H2O","HCl","NH3","NaH","H2SO4","H2O2"],uses:"Haber process (NH3 production), fuel cells, hydrogenation of oils, rocket fuel, petroleum refining",examRel:95,examTopics:["bonding","redox","Haber process","fuel cells","acids-bases"]},

{z:3,sym:"Li",name:"Lithium",mass:6.941,cat:"alkali-metal",group:1,period:2,block:"s",row:2,col:1,eConfig:"1s2 2s1",eShort:"[He] 2s1",en:0.98,ie:[520,7298,11815],ox:["+1"],mp:180.54,bp:1342,density:0.534,state:"solid",radius:167,discovered:"1817",discoverer:"Johan August Arfwedson",props:"Lightest metal, least reactive of alkali metals. Burns with crimson flame. Reacts slowly with water (less vigorous than Na/K). Anomalous properties due to small size and high charge density. Forms covalent compounds more readily than other Group 1 metals.",compounds:["Li2O","LiOH","Li2CO3","LiCl","LiBr"],uses:"Lithium-ion batteries, psychiatric medication (Li2CO3), ceramics, lubricating greases, nuclear fusion research",examRel:75,examTopics:["Group 1","flame tests","reactivity trends","anomalous properties"]},
{z:4,sym:"Be",name:"Beryllium",mass:9.012,cat:"alkaline-earth",group:2,period:2,block:"s",row:2,col:2,eConfig:"1s2 2s2",eShort:"[He] 2s2",en:1.57,ie:[900,1757,14849],ox:["+2"],mp:1287,bp:2469,density:1.85,state:"solid",radius:112,discovered:"1798",discoverer:"Louis Nicolas Vauquelin",props:"Lightest alkaline earth metal. Anomalous - forms covalent compounds rather than ionic. BeCl2 is linear and electron deficient. Very toxic. High melting point for its size.",compounds:["BeCl2","BeO","Be(OH)2","BeF2"],uses:"Aerospace alloys (with Cu), X-ray windows, nuclear reactors, gyroscopes",examRel:45,examTopics:["Group 2","anomalous properties","bonding"]},

const EXAM_QUESTIONS = [
// ATOMIC STRUCTURE & ELECTRON CONFIGURATION
{id:1,topic:"Atomic Structure",el:null,type:"mcq",q:"Which sub-shell is filled immediately after 3p in order of increasing energy?",opts:["3d","4s","4p","4d"],correct:1,explanation:"The 4s sub-shell fills before 3d due to lower energy (Aufbau principle). The order is 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p...",marks:1,board:"AQA/OCR",prob:90},
{id:2,topic:"Atomic Structure",el:24,type:"mcq",q:"What is the electron configuration of Cr (Z=24)?",opts:["[Ar] 3d4 4s2","[Ar] 3d5 4s1","[Ar] 3d6","[Ar] 3d3 4s2 4p1"],correct:1,explanation:"Chromium has anomalous configuration [Ar] 3d5 4s1 because a half-filled 3d sub-shell (3d5) is particularly stable. One 4s electron is promoted to 3d.",marks:1,board:"AQA",prob:85},
{id:3,topic:"Atomic Structure",el:29,type:"mcq",q:"What is the electron configuration of Cu (Z=29)?",opts:["[Ar] 3d9 4s2","[Ar] 3d10 4s1","[Ar] 3d8 4s2 4p1","[Ar] 3d10 4s0"],correct:1,explanation:"Copper has anomalous configuration [Ar] 3d10 4s1 because a fully-filled 3d sub-shell (3d10) is particularly stable.",marks:1,board:"AQA",prob:85},
{id:4,topic:"Atomic Structure",el:26,type:"mcq",q:"What is the electron configuration of Fe2+?",opts:["[Ar] 3d6 4s2","[Ar] 3d6","[Ar] 3d4 4s2","[Ar] 3d5 4s1"],correct:1,explanation:"Fe is [Ar] 3d6 4s2. When forming Fe2+, the 4s electrons are lost FIRST (not 3d), giving [Ar] 3d6. 4s electrons are removed before 3d when forming ions.",marks:2,board:"AQA/OCR",prob:88},
{id:5,topic:"Atomic Structure",el:null,type:"mcq",q:"Which of the following has the most energy levels in its electron configuration?",opts:["Na","K","Ca","Ar"],correct:1,explanation:"K (potassium) has configuration [Ar] 4s1 with 4 energy levels (1,2,3,4). Na has 3, Ca has 4 but same as K, Ar has 3. K was the intended answer as it fills 4s first.",marks:1,board:"OCR",prob:70},
{id:6,topic:"Atomic Structure",el:null,type:"mcq",q:"How many electrons can a d sub-shell hold?",opts:["2","6","10","14"],correct:2,explanation:"A d sub-shell contains 5 orbitals, each holding 2 electrons, so 5 x 2 = 10 electrons maximum. s=2, p=6, d=10, f=14.",marks:1,board:"AQA",prob:85},
{id:7,topic:"Atomic Structure",el:null,type:"short",q:"Write the full electron configuration of a sulfide ion (S2-).",opts:[],correct:"1s2 2s2 2p6 3s2 3p6",explanation:"S is [Ne] 3s2 3p4. Adding 2 electrons gives S2-: 1s2 2s2 2p6 3s2 3p6, which is isoelectronic with Ar.",marks:2,board:"AQA",prob:80},
{id:8,topic:"Atomic Structure",el:null,type:"mcq",q:"What is the maximum number of electrons in the third shell (n=3)?",opts:["8","18","32","2"],correct:1,explanation:"The third shell has s, p, and d sub-shells: 3s(2) + 3p(6) + 3d(10) = 18 electrons maximum. The formula is 2n2 = 2(9) = 18.",marks:1,board:"OCR",prob:75},
{id:9,topic:"Atomic Structure",el:null,type:"mcq",q:"An atom has the electron configuration 1s2 2s2 2p6 3s2 3p3. How many unpaired electrons does it have?",opts:["1","2","3","5"],correct:2,explanation:"The 3p sub-shell has 3 electrons in 3 orbitals. By Hund's rule, each orbital gets one electron first, so all 3 are unpaired. This is phosphorus.",marks:1,board:"AQA",prob:82},
{id:10,topic:"Atomic Structure",el:null,type:"mcq",q:"Which species is isoelectronic with neon?",opts:["Na+","Cl-","Ca2+","K+"],correct:0,explanation:"Na+ has 10 electrons (11-1=10), same as neon. Cl- has 18, Ca2+ has 18, K+ has 18. All of Cl-, Ca2+, and K+ are isoelectronic with argon.",marks:1,board:"Edexcel",prob:78},
// PERIODICITY
{id:11,topic:"Periodicity",el:null,type:"mcq",q:"Across Period 3 (Na to Ar), what happens to atomic radius?",opts:["Increases","Decreases","Stays the same","Increases then decreases"],correct:1,explanation:"Atomic radius decreases across Period 3 because nuclear charge increases while shielding remains similar (electrons added to same shell), so electrons are pulled closer to nucleus.",marks:2,board:"AQA",prob:90},
{id:12,topic:"Periodicity",el:null,type:"mcq",q:"Which element in Period 3 has the highest first ionisation energy?",opts:["Na","Mg","Cl","Ar"],correct:3,explanation:"Argon has the highest first IE in Period 3. IE generally increases across a period due to increasing nuclear charge. Ar has a full outer shell (very stable configuration).",marks:1,board:"AQA",prob:85},
{id:13,topic:"Periodicity",el:13,type:"mcq",q:"Why is the first ionisation energy of aluminium LOWER than magnesium, despite Al having a higher nuclear charge?",opts:["Al has more shielding","Al's outer electron is in a 3p orbital which is higher energy and easier to remove than Mg's 3s","Al has a larger atomic radius","Al has fewer protons"],correct:1,explanation:"Al's outer electron is in 3p1, which is higher in energy than Mg's 3s2. The 3p electron is slightly further from the nucleus and easier to remove, despite Al having one more proton.",marks:3,board:"AQA/OCR",prob:88},
{id:14,topic:"Periodicity",el:16,type:"mcq",q:"Why is the first ionisation energy of sulfur LOWER than phosphorus?",opts:["S has more protons","S has a paired electron in 3p4 that experiences repulsion","S has more electron shielding","S has a smaller atomic radius"],correct:1,explanation:"S has configuration 3p4 with one paired electron. The electron-electron repulsion in the paired orbital makes it easier to remove compared to P's 3p3 (all unpaired, half-filled stability).",marks:3,board:"AQA/OCR",prob:86},
{id:15,topic:"Periodicity",el:null,type:"mcq",q:"What type of bonding exists in Period 3 element silicon?",opts:["Simple molecular","Giant ionic","Giant covalent","Giant metallic"],correct:2,explanation:"Silicon has a giant covalent (macromolecular) structure similar to diamond. Each Si atom is covalently bonded to 4 others in a tetrahedral arrangement. This gives it a very high melting point.",marks:1,board:"AQA",prob:82},
{id:16,topic:"Periodicity",el:null,type:"mcq",q:"Which Period 3 oxide is amphoteric?",opts:["Na2O","MgO","Al2O3","SiO2"],correct:2,explanation:"Al2O3 is amphoteric - it reacts with both acids and bases. Na2O and MgO are basic oxides, SiO2 is weakly acidic, and P4O10, SO3, Cl2O7 are acidic.",marks:1,board:"AQA",prob:85},
{id:17,topic:"Periodicity",el:null,type:"mcq",q:"What is the trend in electronegativity across Period 3?",opts:["Increases","Decreases","No change","Increases then decreases"],correct:0,explanation:"Electronegativity increases across Period 3 (Na=0.93 to Cl=3.16) because nuclear charge increases and atomic radius decreases, so atoms attract bonding electrons more strongly. Noble gases excluded.",marks:2,board:"AQA",prob:85},
{id:18,topic:"Periodicity",el:null,type:"short",q:"Explain why metals have high melting points compared to simple molecular substances.",opts:[],correct:"Metals have strong metallic bonding with electrostatic attraction between positive metal ions and delocalised electrons throughout the structure. This requires a lot of energy to overcome.",explanation:"Metallic bonding involves a lattice of positive ions surrounded by a sea of delocalised electrons. The strong electrostatic attraction between these requires significant energy to break, hence high melting points.",marks:3,board:"AQA",prob:80},
{id:19,topic:"Periodicity",el:null,type:"mcq",q:"Which Period 3 element has the highest melting point?",opts:["Na","Mg","Al","Si"],correct:3,explanation:"Silicon has the highest melting point in Period 3 (1414°C) because it has a giant covalent structure. Strong covalent bonds throughout the structure require a huge amount of energy to break.",marks:1,board:"OCR",prob:78},
{id:20,topic:"Periodicity",el:null,type:"mcq",q:"The melting point of Na is higher than that of K. This is because:",opts:["Na has fewer protons","Na+ is smaller than K+ so metallic bond is stronger","Na has more electron shells","Na has higher electronegativity"],correct:1,explanation:"Na+ is smaller than K+, so the charge density is higher and the metallic bonding (attraction between metal cations and delocalised electrons) is stronger. This means more energy is needed to break the bonds.",marks:2,board:"AQA",prob:75},
// BONDING
{id:21,topic:"Bonding",el:null,type:"mcq",q:"What type of bonding is present in magnesium chloride (MgCl2)?",opts:["Covalent","Metallic","Ionic","Van der Waals"],correct:2,explanation:"MgCl2 has ionic bonding. Mg (metal, electronegativity 1.31) transfers electrons to Cl (non-metal, electronegativity 3.16). The large electronegativity difference indicates ionic bonding.",marks:1,board:"AQA",prob:88},
{id:22,topic:"Bonding",el:null,type:"mcq",q:"What is the shape of a methane (CH4) molecule?",opts:["Linear","Trigonal planar","Tetrahedral","Pyramidal"],correct:2,explanation:"CH4 has 4 bonding pairs and 0 lone pairs around C. VSEPR theory predicts tetrahedral shape with bond angles of 109.5°.",marks:1,board:"AQA/OCR",prob:92},
{id:23,topic:"Bonding",el:null,type:"mcq",q:"What is the bond angle in a water (H2O) molecule?",opts:["180°","120°","109.5°","104.5°"],correct:3,explanation:"H2O has 2 bonding pairs and 2 lone pairs. The lone pairs repel more than bonding pairs, compressing the bond angle from 109.5° (tetrahedral) to 104.5°.",marks:1,board:"AQA",prob:88},
{id:24,topic:"Bonding",el:null,type:"mcq",q:"Which intermolecular force is the strongest?",opts:["London dispersion forces","Permanent dipole-dipole","Hydrogen bonding","Ion-dipole"],correct:2,explanation:"Among the three main intermolecular forces, hydrogen bonding is strongest (occurs between H bonded to N, O, or F and a lone pair on another N, O, or F). London forces are weakest, dipole-dipole is intermediate.",marks:1,board:"AQA",prob:90},
{id:25,topic:"Bonding",el:null,type:"mcq",q:"Diamond and graphite are allotropes of carbon. Why does graphite conduct electricity but diamond does not?",opts:["Graphite has free ions","Graphite has delocalised electrons between layers","Diamond is too hard","Graphite has ionic bonds"],correct:1,explanation:"In graphite, each C is bonded to 3 others (sp2), leaving one electron per C delocalised across the layers. These delocalised electrons can carry charge. In diamond, all 4 electrons are used in covalent bonds (sp3), none are free.",marks:3,board:"AQA/OCR",prob:88},
{id:26,topic:"Bonding",el:null,type:"mcq",q:"What is the shape of SF6?",opts:["Tetrahedral","Trigonal bipyramidal","Octahedral","Square planar"],correct:2,explanation:"SF6 has 6 bonding pairs around S with no lone pairs. VSEPR predicts octahedral geometry with 90° bond angles. S can expand its octet using 3d orbitals.",marks:1,board:"AQA",prob:72},
{id:27,topic:"Bonding",el:null,type:"mcq",q:"Why does ice float on water?",opts:["Ice has lower density because hydrogen bonds create an open lattice structure","Ice molecules are lighter","Water molecules are more tightly packed due to ionic bonds","Ice has covalent bonds"],correct:0,explanation:"In ice, hydrogen bonds hold water molecules in a regular open lattice structure, making ice less dense than liquid water. In liquid water, the hydrogen bond network is partially broken and molecules can pack more closely.",marks:3,board:"OCR",prob:75},
{id:28,topic:"Bonding",el:null,type:"mcq",q:"Which molecule has a permanent dipole?",opts:["CO2","CCl4","CHCl3","BF3"],correct:2,explanation:"CHCl3 (chloroform) is polar because it has an asymmetric distribution of polar bonds (tetrahedral with 3 Cl and 1 H). CO2, CCl4, and BF3 are symmetric so dipoles cancel out.",marks:2,board:"AQA",prob:80},
{id:29,topic:"Bonding",el:null,type:"short",q:"Explain why NaCl has a high melting point.",opts:[],correct:"NaCl has a giant ionic lattice with strong electrostatic attractions between Na+ and Cl- ions in all directions. A large amount of energy is needed to overcome these strong ionic bonds.",explanation:"Giant ionic lattice. Strong electrostatic forces of attraction between oppositely charged ions (Na+ and Cl-). These forces act in all directions. A lot of energy is required to overcome these strong forces, hence the high melting point.",marks:3,board:"AQA",prob:85},
{id:30,topic:"Bonding",el:null,type:"mcq",q:"What type of hybridisation does carbon have in ethene (C2H4)?",opts:["sp","sp2","sp3","sp3d"],correct:1,explanation:"In ethene, each C forms 3 sigma bonds (2 C-H + 1 C-C) and 1 pi bond. This requires sp2 hybridisation, giving a trigonal planar geometry around each C with 120° bond angles.",marks:2,board:"AQA",prob:78},
// REDOX
{id:31,topic:"Redox",el:null,type:"mcq",q:"In the reaction 2Na + Cl2 -> 2NaCl, which species is oxidised?",opts:["Na","Cl2","NaCl","None"],correct:0,explanation:"Na is oxidised (loses electrons): Na -> Na+ + e-. Oxidation is loss of electrons (OIL RIG). Cl2 is reduced: Cl2 + 2e- -> 2Cl-.",marks:1,board:"AQA",prob:90},
{id:32,topic:"Redox",el:null,type:"mcq",q:"What is the oxidation state of S in H2SO4?",opts:["+2","+4","+6","+8"],correct:2,explanation:"In H2SO4: H is +1 (x2 = +2), O is -2 (x4 = -8). Total = 0. So S = 0 - (+2) - (-8) = +6.",marks:1,board:"AQA/OCR",prob:85},
{id:33,topic:"Redox",el:null,type:"mcq",q:"What is the oxidation state of Mn in MnO4-?",opts:["+3","+5","+7","+4"],correct:2,explanation:"In MnO4-: O is -2 (x4 = -8). Total charge = -1. So Mn = -1 - (-8) = +7.",marks:1,board:"AQA",prob:82},
{id:34,topic:"Redox",el:null,type:"mcq",q:"In a disproportionation reaction, an element is:",opts:["Only oxidised","Only reduced","Both oxidised and reduced simultaneously","Neither oxidised nor reduced"],correct:2,explanation:"Disproportionation is when the same element in a single species is simultaneously oxidised and reduced. Example: Cl2 + 2NaOH -> NaCl + NaClO + H2O (Cl goes from 0 to -1 and +1).",marks:2,board:"AQA",prob:80},
{id:35,topic:"Redox",el:17,type:"mcq",q:"What happens when chlorine is added to water?",opts:["Nothing","Cl2 disproportionates to form HCl and HClO","Cl2 is reduced to Cl-","Cl2 is oxidised to ClO3-"],correct:1,explanation:"Cl2 + H2O -> HCl + HClO. Chlorine disproportionates: Cl (0) is both reduced to Cl- (-1) in HCl and oxidised to Cl+ (+1) in HClO. This is how chlorine purifies water.",marks:2,board:"AQA",prob:82},
// GROUP 1
{id:36,topic:"Group 1",el:null,type:"mcq",q:"Why does reactivity increase down Group 1?",opts:["Atomic radius increases so outer electron is further from nucleus and easier to remove","Nuclear charge increases","Electronegativity increases","Number of electron shells decreases"],correct:0,explanation:"Down Group 1, atomic radius increases and shielding increases. The outer s electron is further from the nucleus and experiences less effective nuclear charge, so it is easier to remove (lower IE). This makes the metal more reactive.",marks:3,board:"AQA/OCR",prob:88},
{id:37,topic:"Group 1",el:11,type:"mcq",q:"What is the balanced equation for sodium reacting with water?",opts:["Na + H2O -> NaOH + H2","2Na + 2H2O -> 2NaOH + H2","Na + 2H2O -> Na(OH)2 + H2","2Na + H2O -> Na2O + H2"],correct:1,explanation:"2Na + 2H2O -> 2NaOH + H2. Sodium reacts with water to form sodium hydroxide solution and hydrogen gas. The metal fizzes and melts into a ball on the surface.",marks:2,board:"AQA",prob:85},
{id:38,topic:"Group 1",el:null,type:"mcq",q:"What colour flame does potassium produce?",opts:["Yellow","Crimson red","Lilac/purple","Green"],correct:2,explanation:"K = lilac/purple, Na = yellow, Li = crimson red, Ca = orange-red, Ba = green, Cu = blue-green. Flame tests are used to identify metal ions.",marks:1,board:"AQA/OCR",prob:82},
{id:39,topic:"Group 1",el:null,type:"mcq",q:"Which Group 1 metal reacts most vigorously with water?",opts:["Li","Na","K","Cs"],correct:3,explanation:"Reactivity increases down Group 1. Cs (caesium) is the most reactive stable alkali metal. It explodes on contact with water.",marks:1,board:"AQA",prob:80},
// GROUP 2
{id:40,topic:"Group 2",el:null,type:"mcq",q:"What is the trend in solubility of Group 2 hydroxides going down the group?",opts:["Decreases","Increases","Stays the same","Alternates"],correct:1,explanation:"Group 2 hydroxide solubility INCREASES down the group: Mg(OH)2 (slightly soluble) < Ca(OH)2 < Sr(OH)2 < Ba(OH)2 (soluble). This is an important A-level trend.",marks:2,board:"AQA",prob:82},
{id:41,topic:"Group 2",el:null,type:"mcq",q:"What is the trend in solubility of Group 2 sulfates going down the group?",opts:["Increases","Decreases","Stays the same","First increases then decreases"],correct:1,explanation:"Group 2 sulfate solubility DECREASES down the group: MgSO4 (soluble) > CaSO4 (slightly) > SrSO4 (insoluble) > BaSO4 (very insoluble). Opposite to hydroxides!",marks:2,board:"AQA",prob:80},
{id:42,topic:"Group 2",el:null,type:"mcq",q:"Which Group 2 carbonate requires the highest temperature to decompose?",opts:["MgCO3","CaCO3","SrCO3","BaCO3"],correct:3,explanation:"Thermal stability of Group 2 carbonates INCREASES down the group. BaCO3 needs the highest temperature. Larger cation = less polarising = harder to decompose the carbonate ion.",marks:2,board:"AQA/OCR",prob:78},
{id:43,topic:"Group 2",el:12,type:"mcq",q:"What is observed when magnesium reacts with steam?",opts:["No reaction","Vigorous reaction, white solid MgO and H2 produced","Gentle fizzing","Explosive reaction"],correct:1,explanation:"Mg + H2O(steam) -> MgO + H2. Magnesium burns brightly in steam, producing white magnesium oxide and hydrogen gas. Mg reacts with steam but not cold water.",marks:2,board:"AQA",prob:78},
// GROUP 17 (HALOGENS)
{id:44,topic:"Group 17",el:null,type:"mcq",q:"What is the trend in boiling point of halogens going down the group?",opts:["Decreases","Increases","Stays the same","Alternates"],correct:1,explanation:"Boiling point INCREASES down Group 17: F2 (-188°C) < Cl2 (-34°C) < Br2 (59°C) < I2 (184°C). This is because London dispersion forces increase with more electrons and larger electron clouds.",marks:2,board:"AQA",prob:85},
{id:45,topic:"Group 17",el:null,type:"mcq",q:"Which halogen can displace bromide ions from solution?",opts:["Fluorine and chlorine only","Chlorine only","Iodine","Bromine"],correct:0,explanation:"A more reactive halogen displaces a less reactive one. Reactivity decreases down Group 17: F > Cl > Br > I. So F2 and Cl2 can both displace Br- from solution. Cl2 + 2KBr -> 2KCl + Br2.",marks:2,board:"AQA/OCR",prob:85},
{id:46,topic:"Group 17",el:null,type:"mcq",q:"What is observed when chlorine water is added to potassium iodide solution?",opts:["No change","Solution turns brown/yellow and iodine is produced","Solution turns green","White precipitate forms"],correct:1,explanation:"Cl2 + 2KI -> 2KCl + I2. Chlorine displaces iodide. The solution turns brown/yellow due to iodine being produced. Cl is more reactive than I (stronger oxidising agent).",marks:2,board:"AQA",prob:85},
{id:47,topic:"Group 17",el:null,type:"mcq",q:"What colour precipitate forms when silver nitrate is added to a solution containing chloride ions?",opts:["White","Cream","Yellow","No precipitate"],correct:0,explanation:"Ag+ + Cl- -> AgCl (white precipitate). AgBr is cream, AgI is yellow. These precipitates are used to identify halide ions. AgCl dissolves in dilute NH3, AgBr in conc NH3, AgI doesn't dissolve.",marks:1,board:"AQA/OCR",prob:88},
{id:48,topic:"Group 17",el:null,type:"mcq",q:"Why does reactivity of halogens decrease down the group?",opts:["Atomic radius increases so electron is gained less easily","Nuclear charge decreases","Ionisation energy increases","Electronegativity increases"],correct:0,explanation:"Down Group 17, atomic radius and shielding increase. The nucleus is less able to attract an incoming electron to fill the outer shell. This means the halogen is a weaker oxidising agent and less reactive.",marks:3,board:"AQA",prob:85},
// TRANSITION METALS
{id:49,topic:"Transition Metals",el:null,type:"mcq",q:"Which is NOT a typical property of transition metals?",opts:["Variable oxidation states","Formation of coloured compounds","Low melting points","Acting as catalysts"],correct:2,explanation:"Transition metals typically have HIGH melting points (due to strong metallic bonding with d electrons contributing). They also show variable oxidation states, form coloured compounds, and act as catalysts.",marks:1,board:"AQA",prob:85},
{id:50,topic:"Transition Metals",el:null,type:"mcq",q:"Why do transition metal compounds often appear coloured?",opts:["They absorb all visible light","d-d transitions: partially filled d orbitals split in energy and electrons absorb specific wavelengths when transitioning","They reflect all visible light","They have very high melting points"],correct:1,explanation:"In transition metal complexes, d orbitals split into different energy levels. Electrons can absorb visible light to jump between these levels (d-d transitions). The transmitted/reflected light appears as the complementary colour.",marks:3,board:"AQA/OCR",prob:82},
{id:51,topic:"Transition Metals",el:null,type:"mcq",q:"Which transition metal ion would be COLOURLESS?",opts:["Cu2+","Fe3+","Zn2+","Cr3+"],correct:2,explanation:"Zn2+ has configuration [Ar] 3d10 (full d sub-shell). With no partially filled d orbitals, d-d transitions cannot occur, so Zn2+ compounds are colourless. Cu2+ is blue, Fe3+ is yellow, Cr3+ is green.",marks:2,board:"AQA",prob:80},
{id:52,topic:"Transition Metals",el:26,type:"mcq",q:"Iron is used as a catalyst in the Haber process. What reaction does it catalyse?",opts:["SO2 + O2 -> SO3","N2 + 3H2 -> 2NH3","2H2O2 -> 2H2O + O2","CH3OH + O2 -> CO2 + H2O"],correct:1,explanation:"The Haber process: N2(g) + 3H2(g) ⇌ 2NH3(g). Iron catalyst, 450°C, 200 atm. This is a reversible reaction (compromise conditions between yield and rate).",marks:1,board:"AQA/OCR",prob:88},
{id:53,topic:"Transition Metals",el:29,type:"mcq",q:"What colour change occurs when excess ammonia is added to copper(II) sulfate solution?",opts:["Blue to green","Pale blue to deep blue","Blue to white precipitate","Blue to colourless"],correct:1,explanation:"[Cu(H2O)6]2+ (pale blue) + 4NH3 -> [Cu(NH3)4(H2O)2]2+ (deep blue) + 4H2O. This is a ligand exchange reaction where NH3 replaces H2O ligands. The deep blue colour is characteristic.",marks:2,board:"AQA",prob:80},
{id:54,topic:"Transition Metals",el:23,type:"mcq",q:"Vanadium(V) oxide is used as a catalyst in which industrial process?",opts:["Haber process","Contact process","Ostwald process","Cracking"],correct:1,explanation:"The Contact process: 2SO2 + O2 -> 2SO3 (with V2O5 catalyst at 450°C). SO3 is then converted to H2SO4 (sulfuric acid). V2O5 works by changing oxidation state: V5+ -> V4+ -> V5+.",marks:1,board:"AQA",prob:78},
// EQUILIBRIA
{id:55,topic:"Equilibria",el:null,type:"mcq",q:"In the Haber process (N2 + 3H2 ⇌ 2NH3, ΔH = -92 kJ/mol), what happens to the yield of NH3 if pressure is increased?",opts:["Decreases","Increases","Stays the same","First increases then decreases"],correct:1,explanation:"Increasing pressure shifts equilibrium towards fewer gas moles (Le Chatelier's principle). Reactants have 4 moles of gas (1+3), products have 2 moles. So equilibrium shifts right, increasing NH3 yield.",marks:2,board:"AQA/OCR",prob:88},
{id:56,topic:"Equilibria",el:null,type:"mcq",q:"For an exothermic reaction at equilibrium, what happens to the yield of products if temperature is increased?",opts:["Increases","Decreases","No change","Depends on the reaction"],correct:1,explanation:"For an exothermic reaction (ΔH negative), increasing temperature shifts equilibrium towards endothermic direction (backwards) to absorb heat. This DECREASES product yield. Le Chatelier's principle.",marks:2,board:"AQA",prob:85},
{id:57,topic:"Equilibria",el:null,type:"mcq",q:"Does a catalyst affect the position of equilibrium?",opts:["Yes, shifts it right","Yes, shifts it left","No, it reaches equilibrium faster but position unchanged","Yes, increases Kc"],correct:2,explanation:"A catalyst speeds up both forward and reverse reactions equally. It does NOT change the position of equilibrium or the value of Kc. It only makes equilibrium reached faster.",marks:2,board:"AQA/OCR",prob:85},
// ENERGETICS
{id:58,topic:"Energetics",el:null,type:"mcq",q:"Which of the following is always exothermic?",opts:["Bond breaking","Bond making","Dissolving","Neutralisation"],correct:1,explanation:"Bond making (formation) is ALWAYS exothermic (releases energy). Bond breaking is ALWAYS endothermic (requires energy). The overall enthalpy change depends on which is larger.",marks:1,board:"AQA",prob:85},
{id:59,topic:"Energetics",el:null,type:"mcq",q:"The enthalpy of formation of a compound is defined as:",opts:["Energy to break all bonds in one mole","Enthalpy change when 1 mole of compound is formed from its elements in standard states","Heat released when 1 mole burns completely","Energy to decompose 1 mole"],correct:1,explanation:"Standard enthalpy of formation (ΔfH°) is the enthalpy change when 1 mole of a compound is formed from its constituent elements in their standard states under standard conditions (298K, 100kPa).",marks:2,board:"AQA",prob:82},
{id:60,topic:"Energetics",el:null,type:"mcq",q:"In a Born-Haber cycle for NaCl, which step has the largest magnitude?",opts:["Ionisation energy of Na","Electron affinity of Cl","Lattice enthalpy of NaCl","Enthalpy of atomisation of Na"],correct:2,explanation:"Lattice enthalpy of NaCl (-787 kJ/mol) has the largest magnitude. It represents the strong electrostatic attraction between Na+ and Cl- ions in the crystal lattice. IE of Na is +496, EA of Cl is -349.",marks:2,board:"AQA",prob:75},
{id:61,topic:"Energetics",el:null,type:"mcq",q:"What is Hess's Law?",opts:["Energy cannot be created or destroyed","The total enthalpy change is independent of the route taken","Entropy always increases","Enthalpy equals internal energy plus PV work"],correct:1,explanation:"Hess's Law states that the total enthalpy change for a reaction is independent of the route taken, provided initial and final conditions are the same. This is a consequence of conservation of energy.",marks:2,board:"AQA/OCR",prob:88},
// ACIDS-BASES
{id:62,topic:"Acids & Bases",el:null,type:"mcq",q:"According to Bronsted-Lowry theory, an acid is:",opts:["An electron pair donor","A proton (H+) donor","A substance that produces OH- ions","An electron pair acceptor"],correct:1,explanation:"Bronsted-Lowry acid = proton (H+) donor. Bronsted-Lowry base = proton acceptor. Lewis acid = electron pair acceptor. Lewis base = electron pair donor.",marks:1,board:"AQA/OCR",prob:88},
{id:63,topic:"Acids & Bases",el:null,type:"mcq",q:"What is the pH of a 0.01 mol/dm3 solution of HCl?",opts:["1","2","3","0.01"],correct:1,explanation:"HCl is a strong acid (fully dissociates). [H+] = 0.01 = 10^-2 mol/dm3. pH = -log[H+] = -log(10^-2) = 2.",marks:1,board:"AQA",prob:85},
{id:64,topic:"Acids & Bases",el:null,type:"mcq",q:"Which is a strong acid?",opts:["CH3COOH","HF","H2SO4","H2CO3"],correct:2,explanation:"H2SO4 (sulfuric acid) is a strong acid - it fully dissociates in water. CH3COOH (ethanoic acid), HF, and H2CO3 are weak acids - they partially dissociate.",marks:1,board:"AQA",prob:85},
// ORGANIC CHEMISTRY LINKS
{id:65,topic:"Organic Chemistry",el:6,type:"mcq",q:"What is the general formula of an alkane?",opts:["CnH2n","CnH2n+2","CnH2n-2","CnHn"],correct:1,explanation:"Alkanes have general formula CnH2n+2. They are saturated hydrocarbons with only single C-C and C-H bonds. Examples: CH4, C2H6, C3H8.",marks:1,board:"AQA/OCR",prob:90},
{id:66,topic:"Organic Chemistry",el:null,type:"mcq",q:"What type of reaction occurs when bromine water is added to an alkene?",opts:["Substitution","Elimination","Electrophilic addition","Free radical substitution"],correct:2,explanation:"Alkenes undergo electrophilic addition with Br2. The electron-rich C=C double bond attacks the electrophilic Br2. Br2 water decolorises from orange to colourless - this is the test for unsaturation.",marks:2,board:"AQA",prob:88},
{id:67,topic:"Organic Chemistry",el:null,type:"mcq",q:"What is the mechanism for the reaction of methane with chlorine in UV light?",opts:["Electrophilic addition","Nucleophilic substitution","Free radical substitution","Elimination"],correct:2,explanation:"CH4 + Cl2 -> CH3Cl + HCl (in UV light). This is free radical substitution with 3 stages: Initiation (Cl2 -> 2Cl•), Propagation (Cl• + CH4 -> CH3• + HCl, CH3• + Cl2 -> CH3Cl + Cl•), Termination.",marks:2,board:"AQA/OCR",prob:85},
{id:68,topic:"Organic Chemistry",el:null,type:"mcq",q:"What reagent and conditions are needed to convert a primary alcohol to a carboxylic acid?",opts:["Conc. H2SO4, heat","K2Cr2O7/H2SO4, heat under reflux","NaOH(aq), heat","KMnO4, room temperature"],correct:1,explanation:"Acidified potassium dichromate (K2Cr2O7/H2SO4) heated under reflux fully oxidises a primary alcohol: R-CH2OH -> R-CHO -> R-COOH. Reflux prevents aldehyde escaping, ensuring full oxidation.",marks:2,board:"AQA",prob:82},
// KINETICS
{id:69,topic:"Kinetics",el:null,type:"mcq",q:"Increasing temperature increases reaction rate because:",opts:["Particles have more surface area","More particles exceed the activation energy and collision frequency increases","The activation energy decreases","Products are more stable"],correct:1,explanation:"Higher temperature means particles have more kinetic energy. This means (1) more particles exceed the activation energy (main reason) and (2) collision frequency increases slightly. Both increase rate.",marks:3,board:"AQA/OCR",prob:88},
{id:70,topic:"Kinetics",el:null,type:"mcq",q:"A catalyst increases reaction rate by:",opts:["Increasing temperature","Providing an alternative reaction pathway with lower activation energy","Increasing concentration","Increasing pressure"],correct:1,explanation:"A catalyst provides an alternative reaction pathway with a lower activation energy (Ea). More particles can exceed this lower Ea at the same temperature, so more successful collisions occur per unit time.",marks:2,board:"AQA",prob:90},
// ELECTROCHEMISTRY
{id:71,topic:"Electrochemistry",el:null,type:"mcq",q:"In electrolysis of molten NaCl, what is produced at the cathode?",opts:["Chlorine","Sodium","Oxygen","Hydrogen"],correct:1,explanation:"At the cathode (negative electrode), Na+ ions are reduced: Na+ + e- -> Na. At the anode (positive electrode), Cl- ions are oxidised: 2Cl- -> Cl2 + 2e-.",marks:1,board:"AQA",prob:82},
{id:72,topic:"Electrochemistry",el:null,type:"mcq",q:"In electrolysis of aqueous NaCl, what is produced at the anode?",opts:["Sodium","Oxygen","Chlorine","Hydrogen"],correct:2,explanation:"At the anode in aqueous NaCl, Cl- ions are preferentially discharged (over OH-) because they are in higher concentration: 2Cl- -> Cl2 + 2e-. At cathode: 2H2O + 2e- -> H2 + 2OH-.",marks:2,board:"AQA",prob:78},
// ADDITIONAL BONDING/STRUCTURE
{id:73,topic:"Bonding",el:null,type:"mcq",q:"What is a coordinate (dative covalent) bond?",opts:["A bond where electrons are shared equally","A bond where both electrons come from one atom","A bond formed by transfer of electrons","A bond between metals"],correct:1,explanation:"A coordinate (dative covalent) bond is a covalent bond where both electrons in the shared pair are donated by the SAME atom. Example: NH4+ (H+ accepts lone pair from NH3). Shown as arrow ->.",marks:2,board:"AQA",prob:82},
{id:74,topic:"Bonding",el:null,type:"mcq",q:"What is the shape of NH3?",opts:["Trigonal planar","Tetrahedral","Trigonal pyramidal","Bent"],correct:2,explanation:"NH3 has 3 bonding pairs and 1 lone pair. The electron pair geometry is tetrahedral, but the molecular shape is trigonal pyramidal with bond angles of 107°. The lone pair repels more, compressing the angle from 109.5°.",marks:1,board:"AQA",prob:85},
{id:75,topic:"Bonding",el:null,type:"mcq",q:"Why is the boiling point of HF lower than expected compared to HCl, HBr, HI?",opts:["HF has weaker London forces","Actually HF has a HIGHER boiling point than HCl due to hydrogen bonding","HF has weaker hydrogen bonds","HF has smaller molecules"],correct:1,explanation:"HF has a HIGHER boiling point (19.5°C) than HCl (-85°C), despite being smaller. This is because HF forms strong hydrogen bonds (F is very electronegative with lone pairs). HCl, HBr, HI rely mainly on London forces.",marks:3,board:"AQA",prob:78},
// MORE PERIODICITY / ADVANCED
{id:76,topic:"Periodicity",el:null,type:"mcq",q:"What type of structure do Period 3 elements Na, Mg, and Al have?",opts:["Simple molecular","Giant covalent","Giant metallic","Giant ionic"],correct:2,explanation:"Na, Mg, and Al are metals with giant metallic structures. Metallic bonding: lattice of positive ions with delocalised electrons. Strength increases Na < Mg < Al (more electrons delocalised, higher charge, smaller radius).",marks:2,board:"AQA",prob:82},
{id:77,topic:"Periodicity",el:null,type:"mcq",q:"Which Period 3 chloride produces acidic fumes in moist air?",opts:["NaCl","MgCl2","AlCl3","SiCl4"],correct:3,explanation:"SiCl4 reacts vigorously with water producing acidic fumes: SiCl4 + 2H2O -> SiO2 + 4HCl. AlCl3 also produces HCl fumes. NaCl and MgCl2 simply dissolve. Covalent chlorides hydrolyse in water.",marks:2,board:"AQA",prob:75},
// ADDITIONAL EXAM QUESTIONS
{id:78,topic:"Bonding",el:null,type:"mcq",q:"Metallic bonding involves:",opts:["Transfer of electrons between atoms","Sharing of electron pairs between atoms","Attraction between cations and delocalised electrons","Attraction between molecules"],correct:2,explanation:"Metallic bonding: electrostatic attraction between a lattice of positive metal ions (cations) and a 'sea' of delocalised electrons. These electrons are free to move, explaining electrical conductivity.",marks:2,board:"AQA",prob:88},
{id:79,topic:"Organic Chemistry",el:null,type:"mcq",q:"What is the product of the reaction between ethene and HBr?",opts:["Ethanol","Bromoethane","1,2-dibromoethane","Ethane"],correct:1,explanation:"CH2=CH2 + HBr -> CH3CH2Br (bromoethane). This is electrophilic addition. H adds to one C, Br to the other. With unsymmetrical alkenes, Markovnikov's rule applies.",marks:1,board:"AQA",prob:80},
{id:80,topic:"Energetics",el:null,type:"mcq",q:"Mean bond enthalpy is:",opts:["Exact energy to break a specific bond","Average energy to break one mole of a particular bond type across different molecules","Energy to form one mole of bonds","Heat capacity of a bond"],correct:1,explanation:"Mean bond enthalpy is the average energy required to break 1 mole of a particular type of bond in gaseous molecules, averaged over many different compounds. It's an average, so calculations using them are approximate.",marks:2,board:"AQA",prob:78},
// NUCLEAR/RADIOACTIVITY
{id:81,topic:"Radioactivity",el:null,type:"mcq",q:"Which type of radiation is most ionising?",opts:["Alpha","Beta","Gamma","Neutron"],correct:0,explanation:"Alpha particles are most ionising because they are large (+2 charge, 4 mass units) and interact strongly with matter. However, they have the least penetrating power. Gamma is least ionising but most penetrating.",marks:1,board:"AQA/OCR",prob:78},
{id:82,topic:"Radioactivity",el:null,type:"mcq",q:"What is the mass number and charge of a beta particle?",opts:["Mass 4, charge +2","Mass 0, charge -1","Mass 1, charge 0","Mass 0, charge +1"],correct:1,explanation:"A beta particle (β-) is a high-energy electron: mass number 0, charge -1. It is emitted when a neutron converts to a proton in the nucleus: n -> p + e- + antineutrino.",marks:1,board:"AQA",prob:80},
// MORE TRANSITION METALS
{id:83,topic:"Transition Metals",el:null,type:"mcq",q:"What is a ligand?",opts:["A positive ion","A molecule or ion that donates a lone pair to a central metal ion","A negative electrode","A catalyst"],correct:1,explanation:"A ligand is a molecule or ion that can donate a lone pair of electrons to a central metal ion to form a coordinate (dative covalent) bond. Common ligands: H2O, NH3, Cl-, CN-, OH-.",marks:2,board:"AQA",prob:82},
{id:84,topic:"Transition Metals",el:null,type:"mcq",q:"What is the coordination number of [Fe(H2O)6]3+?",opts:["3","4","6","12"],correct:2,explanation:"The coordination number is the number of coordinate bonds from ligands to the central metal ion. [Fe(H2O)6]3+ has 6 water ligands, each forming one coordinate bond, so coordination number = 6 (octahedral).",marks:1,board:"AQA",prob:80},
{id:85,topic:"Transition Metals",el:null,type:"mcq",q:"What shape is the complex [CuCl4]2-?",opts:["Octahedral","Tetrahedral","Square planar","Linear"],correct:1,explanation:"[CuCl4]2- has 4 Cl- ligands around Cu2+ in a tetrahedral arrangement. Cl- is a larger ligand than H2O so only 4 can fit around the metal ion (compared to 6 H2O in [Cu(H2O)6]2+).",marks:2,board:"AQA",prob:72},
// ACIDS & BUFFERS
{id:86,topic:"Acids & Bases",el:null,type:"mcq",q:"What is a buffer solution?",opts:["A solution with pH 7","A solution that resists changes in pH when small amounts of acid or base are added","A concentrated acid solution","A solution containing only strong acids"],correct:1,explanation:"A buffer solution resists changes in pH on addition of small amounts of acid or alkali. Acidic buffer = weak acid + its conjugate base (salt). e.g., CH3COOH + CH3COONa.",marks:2,board:"AQA",prob:80},
{id:87,topic:"Acids & Bases",el:null,type:"mcq",q:"What is the conjugate base of H2SO4?",opts:["SO42-","HSO4-","H3O+","SO3"],correct:1,explanation:"The conjugate base is formed when an acid donates a proton. H2SO4 -> H+ + HSO4-. So HSO4- is the conjugate base of H2SO4. HSO4- can further donate a proton to give SO42-.",marks:1,board:"AQA",prob:78},
// MORE ORGANIC
{id:88,topic:"Organic Chemistry",el:null,type:"mcq",q:"What is a homologous series?",opts:["A series of compounds with the same molecular formula","A series with the same general formula, differing by CH2, with similar chemical properties","A series of isomers","A series of elements in the same group"],correct:1,explanation:"A homologous series is a family of compounds with the same general formula, same functional group, similar chemical properties, and each member differs from the next by CH2. E.g., alkanes: CH4, C2H6, C3H8...",marks:2,board:"AQA/OCR",prob:85},
{id:89,topic:"Organic Chemistry",el:null,type:"mcq",q:"What is the test for an aldehyde?",opts:["Bromine water decolorises","Tollens' reagent gives a silver mirror","Turns universal indicator red","No reaction with anything"],correct:1,explanation:"Tollens' reagent (ammoniacal silver nitrate) is reduced by aldehydes to form a silver mirror: RCHO + 2Ag+ -> RCOOH + 2Ag. Ketones do NOT react with Tollens' reagent - this distinguishes them from aldehydes.",marks:2,board:"AQA",prob:78},
{id:90,topic:"Organic Chemistry",el:null,type:"mcq",q:"What type of isomerism do butan-1-ol and butan-2-ol exhibit?",opts:["Chain isomerism","Positional isomerism","Functional group isomerism","Optical isomerism"],correct:1,explanation:"Butan-1-ol (OH on C1) and butan-2-ol (OH on C2) are positional isomers - same molecular formula (C4H10O), same functional group (OH), but different position of the functional group on the carbon chain.",marks:1,board:"AQA",prob:82},
// ENTHALPY
{id:91,topic:"Energetics",el:null,type:"mcq",q:"What is lattice enthalpy?",opts:["Energy to break ionic bonds in solution","Enthalpy change when 1 mole of ionic lattice is formed from gaseous ions","Energy to melt a solid","Enthalpy of crystallisation"],correct:1,explanation:"Lattice enthalpy (formation) is the enthalpy change when 1 mole of an ionic compound is formed from its gaseous ions under standard conditions. It is always exothermic (negative). Larger for higher charges and smaller ions.",marks:2,board:"AQA",prob:75},
{id:92,topic:"Energetics",el:null,type:"mcq",q:"Which ionic compound has the most exothermic lattice enthalpy?",opts:["NaCl","NaF","MgO","KCl"],correct:2,explanation:"MgO has the most exothermic lattice enthalpy because both ions have charge 2+ and 2- (compared to 1+/1- for NaCl), AND both are small ions. Lattice enthalpy increases with charge and decreases with ionic radius.",marks:2,board:"AQA",prob:72},
// RATES
{id:93,topic:"Kinetics",el:null,type:"mcq",q:"The rate equation is rate = k[A]2[B]. What is the overall order of reaction?",opts:["1","2","3","4"],correct:2,explanation:"Overall order = sum of individual orders = 2 + 1 = 3. The reaction is second order with respect to A, first order with respect to B, and third order overall.",marks:1,board:"AQA",prob:80},
{id:94,topic:"Kinetics",el:null,type:"mcq",q:"For a first-order reaction, a graph of ln[A] against time gives:",opts:["A curve","A straight line with positive gradient","A straight line with negative gradient","A horizontal line"],correct:2,explanation:"For first order: ln[A] = -kt + ln[A]0. This is y = mx + c form, so plotting ln[A] vs t gives a straight line with gradient = -k (negative) and y-intercept = ln[A]0.",marks:2,board:"AQA",prob:72},
// EXTRA HIGH-YIELD
{id:95,topic:"Bonding",el:null,type:"mcq",q:"Which substance has the highest boiling point?",opts:["CH4","NH3","H2O","HF"],correct:2,explanation:"H2O (100°C) has the highest boiling point due to extensive hydrogen bonding network (each molecule can form up to 4 H-bonds - 2 donor, 2 acceptor). NH3 and HF form fewer H-bonds per molecule.",marks:2,board:"AQA",prob:80},
{id:96,topic:"Redox",el:null,type:"mcq",q:"What is the oxidation state of C in CO2?",opts:["-2","+2","+4","+1"],correct:2,explanation:"In CO2: O is -2 (x2 = -4). Total = 0. So C = 0 - (-4) = +4.",marks:1,board:"AQA",prob:82},
{id:97,topic:"Transition Metals",el:null,type:"mcq",q:"Why is Zn not considered a typical transition metal?",opts:["It's too reactive","Zn2+ has a full d10 sub-shell so it shows no typical transition metal properties","It doesn't form compounds","It has too few electrons"],correct:1,explanation:"Zn only forms Zn2+ with configuration [Ar] 3d10. Since the d sub-shell is full, Zn doesn't show variable oxidation states, coloured compounds, or catalytic activity - the typical transition metal properties.",marks:2,board:"AQA",prob:78},
{id:98,topic:"Periodicity",el:null,type:"mcq",q:"Define first ionisation energy.",opts:["Energy to remove an electron from a neutral atom","Energy to remove one mole of electrons from one mole of gaseous atoms to form one mole of gaseous 1+ ions","Energy to add an electron to a neutral atom","Energy to break a bond"],correct:1,explanation:"1st IE: X(g) -> X+(g) + e-. It is the energy required to remove 1 electron from each atom in 1 mole of gaseous atoms to form 1 mole of gaseous 1+ ions. Key words: mole, gaseous, 1+.",marks:2,board:"AQA/OCR",prob:90},
{id:99,topic:"Group 17",el:null,type:"mcq",q:"What is the colour and state of bromine at room temperature?",opts:["Green gas","Red-brown liquid","Purple solid","Yellow gas"],correct:1,explanation:"Bromine is a red-brown LIQUID at room temperature - it is the only non-metallic element that is liquid at room temperature. It has a low boiling point (59°C) and gives off brown/orange vapour.",marks:1,board:"AQA",prob:85},

{id:112,topic:"Energetics",el:null,type:"mcq",q:"What is entropy?",opts:["The energy content of a system","A measure of the disorder/randomness of a system","The heat capacity of a substance","The activation energy of a reaction"],correct:1,explanation:"Entropy (S) is a measure of the disorder/number of ways particles can be arranged in a system. Entropy increases when: solids melt, liquids boil, reactions produce more moles of gas, substances dissolve.",marks:1,board:"AQA",prob:78},
{id:113,topic:"Energetics",el:null,type:"mcq",q:"A reaction is feasible (spontaneous) when:",opts:["ΔH is negative","ΔS is positive","ΔG is negative (ΔG = ΔH - TΔS)","The activation energy is zero"],correct:2,explanation:"A reaction is thermodynamically feasible when Gibbs free energy change (ΔG) is negative. ΔG = ΔH - TΔS. A reaction can be feasible even if endothermic (ΔH > 0) if TΔS is large enough.",marks:2,board:"AQA",prob:72},

function initTable() {
  const table = document.getElementById('periodic-table');
  table.innerHTML = '';
  ELEMENTS.forEach(el => {
    const div = document.createElement('div');
    div.className = `element ${CATEGORIES[el.cat].cls}`;
    div.dataset.z = el.z;
    div.dataset.cat = el.cat;
    div.style.gridColumn = el.col;
    div.style.gridRow = el.row;
    div.innerHTML = `<span class="z">${el.z}</span><span class="sym">${el.sym}</span><span class="name">${el.name}</span><span class="mass">${el.mass}</span>`;
    if (el.examRel >= 70) {
      div.innerHTML += `<span class="exam-badge">${el.examRel}%</span>`;
    }
    div.onclick = () => showElement(el.z);
    div.title = `${el.name} (${el.sym}) - Z:${el.z}, Mass:${el.mass}, ${el.state}`;
    table.appendChild(div);
  });
  // Lanthanide/Actinide labels
  const lnLabel = document.createElement('div');
  lnLabel.className = 'separator-label';
  lnLabel.style.gridRow = '9';
  lnLabel.style.gridColumn = '1/3';
  lnLabel.textContent = 'Lanthanides';
  table.appendChild(lnLabel);
  const acLabel = document.createElement('div');
  acLabel.className = 'separator-label';
  acLabel.style.gridRow = '10';
  acLabel.style.gridColumn = '1/3';
  acLabel.textContent = 'Actinides';
  table.appendChild(acLabel);
}

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-swatch ${cat.cls}"></div>${cat.name}`;
    item.style.cursor = 'pointer';
    item.onclick = () => filterByCategory(key);
    legend.appendChild(item);
  });
}

function buildCatFilters() {
  const container = document.getElementById('cat-filters');
  container.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn active';
  allBtn.textContent = 'All';
  allBtn.style.background = '#555';
  allBtn.onclick = () => filterByCategory(null);
  container.appendChild(allBtn);
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat.name;
    btn.style.background = cat.color;
    btn.dataset.cat = key;
    btn.onclick = () => filterByCategory(key);
    container.appendChild(btn);
  });
}

function filterByCategory(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (!cat) {
    document.querySelector('.cat-btn').classList.add('active');
  } else {
    document.querySelectorAll(`.cat-btn[data-cat="${cat}"]`).forEach(b => b.classList.add('active'));
  }
  document.querySelectorAll('.element').forEach(el => {
    if (!cat || el.dataset.cat === cat) {
      el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed');
    }
  });
}

function getElectronShells(z) {
  const shells = [];
  const maxE = [2, 8, 18, 32, 32, 18, 8, 2];
  let remaining = z;
  // Simple shell filling (2, 8, 8, 18, 18, 32...)
  const simpleFill = [2, 8, 8, 18, 18, 32, 32, 32];
  for (let i = 0; i < simpleFill.length && remaining > 0; i++) {
    const e = Math.min(remaining, simpleFill[i]);
    shells.push(e);
    remaining -= e;
  }
  return shells;
}

function drawAtomDiagram(el) {
  const shells = getElectronShells(el.z);
  const numShells = shells.length;
  const cx = 160, cy = 160;
  const nucRadius = numShells <= 2 ? 36 : (numShells <= 4 ? 30 : 26);
  const minOrbit = nucRadius + 22;
  const maxOrbit = 145;
  const orbitStep = numShells > 1 ? (maxOrbit - minOrbit) / (numShells - 1) : 0;

  let svg = `<svg viewBox="0 0 320 320" width="280" height="280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">`;

  // Nucleus glow
  svg += `<defs>
    <radialGradient id="nucGlow"><stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.4"/><stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/></radialGradient>
    <radialGradient id="nucFill"><stop offset="0%" stop-color="#ff8a8a"/><stop offset="100%" stop-color="#cc3333"/></radialGradient>
    <radialGradient id="protonFill"><stop offset="0%" stop-color="#ff7070"/><stop offset="100%" stop-color="#cc2222"/></radialGradient>
    <radialGradient id="neutronFill"><stop offset="0%" stop-color="#8888ff"/><stop offset="100%" stop-color="#4444cc"/></radialGradient>
    <radialGradient id="eFill"><stop offset="0%" stop-color="#66ddff"/><stop offset="100%" stop-color="#0099cc"/></radialGradient>
  </defs>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${nucRadius + 15}" fill="url(#nucGlow)"/>`;

  // Nucleus with protons and neutrons
  const protons = el.z;
  const neutrons = Math.round(el.mass) - protons;
  svg += `<circle cx="${cx}" cy="${cy}" r="${nucRadius}" fill="url(#nucFill)" stroke="#ff6666" stroke-width="1" opacity="0.9"/>`;

  // Draw some protons and neutrons inside nucleus (simplified)
  const nucleons = Math.min(protons + neutrons, 20);
  if (nucleons <= 20) {
    const pCount = Math.min(protons, Math.ceil(nucleons * protons / (protons + neutrons)));
    const nCount = nucleons - pCount;
    const particleR = nucRadius <= 20 ? 3 : 4;
    const positions = [];
    for (let i = 0; i < nucleons; i++) {
      const angle = (2 * Math.PI * i / nucleons) + (i % 2) * 0.3;
      const dist = (i < nucleons / 2) ? nucRadius * 0.35 : nucRadius * 0.65;
      positions.push({ x: cx + dist * Math.cos(angle), y: cy + dist * Math.sin(angle) });
    }
    for (let i = 0; i < nucleons; i++) {
      const isProton = i < pCount;
      const fill = isProton ? 'url(#protonFill)' : 'url(#neutronFill)';
      svg += `<circle cx="${positions[i].x.toFixed(1)}" cy="${positions[i].y.toFixed(1)}" r="${particleR}" fill="${fill}" stroke="${isProton ? '#ff4444' : '#6666cc'}" stroke-width="0.5" opacity="0.85"/>`;
    }
  }

  // Nucleus label
  svg += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">${el.sym}</text>`;
  svg += `<text x="${cx}" y="${cy + 12}" text-anchor="middle" fill="#ffcccc" font-size="9">${protons}p ${neutrons > 0 ? neutrons + 'n' : ''}</text>`;

  // Electron shells
  const shellColors = ['#66ddff', '#44bbff', '#22aaee', '#00aacc', '#0088aa', '#006688', '#004466'];
  for (let i = 0; i < numShells; i++) {
    const r = numShells === 1 ? minOrbit : minOrbit + i * orbitStep;
    const color = shellColors[i % shellColors.length];

    // Orbit ring
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>`;

    // Shell label (n=1, n=2 etc.)
    svg += `<text x="${cx + r + 3}" y="${cy - 4}" class="shell-label-text" font-size="8" fill="${color}" opacity="0.7">n=${i + 1}</text>`;

    // Electrons on this shell
    const eCount = shells[i];
    const electronR = numShells <= 3 ? 5 : (numShells <= 5 ? 4 : 3.5);
    for (let j = 0; j < eCount; j++) {
      const angle = (2 * Math.PI * j / eCount) - Math.PI / 2;
      const ex = cx + r * Math.cos(angle);
      const ey = cy + r * Math.sin(angle);
      svg += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${electronR}" fill="url(#eFill)" stroke="#44ccee" stroke-width="0.7"/>`;
      // Minus sign on electron
      if (electronR >= 4) {
        svg += `<text x="${ex.toFixed(1)}" y="${(ey + 1).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="6" font-weight="bold">−</text>`;
      }
    }

    // Electron count for this shell
    svg += `<text x="${cx}" y="${cy + r + (electronR + 6)}" text-anchor="middle" fill="${color}" font-size="8" font-weight="600" opacity="0.8">${eCount}e⁻</text>`;
  }

  svg += `</svg>`;

  // Build electron shell notation string
  const shellNotation = shells.join(', ');

  return `
    <div class="atom-diagram-container">
      <h4>Atomic Structure — Bohr Model</h4>
      ${svg}
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--text);">Electron Arrangement: [${shellNotation}]</div>
      <div style="font-size:11px;color:var(--text2);margin-top:2px;">Total electrons: ${el.z} | Protons: ${protons} | Neutrons: ${neutrons > 0 ? neutrons : '~' + (Math.round(el.mass) - protons)}</div>
      <div class="atom-diagram-legend">
        <span><span class="dot" style="background:#cc3333;"></span> Proton (+)</span>
        <span><span class="dot" style="background:#5555cc;"></span> Neutron (0)</span>
        <span><span class="dot" style="background:#0099cc;"></span> Electron (−)</span>
        <span><span class="dot" style="background:transparent;border:1px dashed #66ddff;"></span> Electron Shell</span>
      </div>
    </div>`;
}

        </div>
        <div class="q-text">${q.q}</div>
        ${q.type==='mcq' ? `<div class="q-options">${q.opts.map((o,i)=>`<div class="q-opt" onclick="revealAnswer(this,${q.id},${i})">${String.fromCharCode(65+i)}) ${o}</div>`).join('')}</div>` : `<div style="font-size:13px;color:var(--text2);margin-top:4px">Short answer question - click to reveal</div><div class="q-opt" onclick="revealAnswer(this,${q.id},-1)">Show Answer</div>`}
        <div class="q-explanation" id="qexp-${q.id}">${q.explanation}</div>
      </div>
    `).join('');
  }
  // About tab
  const aboutTab = document.getElementById('tab-about');
  aboutTab.innerHTML = `
    <div class="section-title">Uses & Applications</div>
    <div class="description-text">${el.uses}</div>
    <div class="section-title">Discovery</div>
    <div class="description-text">Discovered in ${el.discovered} by ${el.discoverer}.</div>
    <div class="section-title">Position in Periodic Table</div>
    <div class="prop-grid">
      <div class="prop-item"><div class="prop-label">Group</div><div class="prop-value">${el.group}</div></div>
      <div class="prop-item"><div class="prop-label">Period</div><div class="prop-value">${el.period}</div></div>
      <div class="prop-item"><div class="prop-label">Block</div><div class="prop-value">${el.block}-block</div></div>
      <div class="prop-item"><div class="prop-label">Category</div><div class="prop-value small">${CATEGORIES[el.cat].name}</div></div>
    </div>
  `;
  // Show modal
  document.getElementById('modal-overlay').classList.add('active');
  switchTab('props', document.querySelector('.modal-tab'));
}

function revealAnswer(el, qid, selectedIdx) {
  const q = EXAM_QUESTIONS.find(x => x.id === qid);
  if (!q) return;
  const card = el.closest('.q-card');
  const opts = card.querySelectorAll('.q-opt');
  opts.forEach((opt, i) => {
    if (q.type === 'mcq') {
      if (i === q.correct) opt.classList.add('reveal-correct');
      else if (i === selectedIdx) opt.classList.add('reveal-wrong');
    }
  });
  if (q.type === 'short') {
    el.innerHTML = `<strong>Answer:</strong> ${q.correct}`;
    el.classList.add('reveal-correct');
  }
  document.getElementById(`qexp-${qid}`).classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

function switchTab(tabName, btn) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

// ========== SEARCH ==========
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.element').forEach(el => {
    const data = ELEMENTS.find(e => e.z == el.dataset.z);
    if (!q || data.name.toLowerCase().includes(q) || data.sym.toLowerCase().includes(q) || String(data.z).includes(q)) {
      el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed');
    }
  });
});

// ========== THEME ==========
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById('theme-btn');
  if (html.dataset.theme === 'dark') {
    html.dataset.theme = 'light';
    btn.textContent = 'Dark Mode';
  } else {
    html.dataset.theme = 'dark';
    btn.textContent = 'Light Mode';
  }
}

// ========== TRENDS ==========
function showTrend(prop) {
  activeTrend = prop;
  const chartDiv = document.getElementById('trend-chart');
  if (prop === 'none') {
    document.querySelectorAll('.element').forEach(el => {
      el.style.filter = '';
      el.style.opacity = '';
    });
    chartDiv.style.display = 'none';
    return;
  }
  const vals = ELEMENTS.map(e => {
    if (prop === 'electronegativity') return e.en || 0;
    if (prop === 'ionization') return e.ie[0] || 0;
    if (prop === 'atomicRadius') return e.radius || 0;
    if (prop === 'meltingPoint') return e.mp || 0;
    if (prop === 'density') return e.density || 0;
    if (prop === 'examRelevance') return e.examRel || 0;
    return 0;
  });
  const maxVal = Math.max(...vals.filter(v => v > 0));
  const minVal = Math.min(...vals.filter(v => v > 0));
  document.querySelectorAll('.element').forEach(el => {
    const data = ELEMENTS.find(e => e.z == el.dataset.z);
    const idx = ELEMENTS.indexOf(data);
    const v = vals[idx];
    if (v > 0) {
      const norm = (v - minVal) / (maxVal - minVal || 1);
      el.style.opacity = 0.3 + norm * 0.7;
      el.style.filter = `brightness(${0.5 + norm * 0.8})`;
    } else {
      el.style.opacity = '0.2';
      el.style.filter = 'grayscale(1)';
    }
  });
  // Draw trend chart
  chartDiv.style.display = 'block';
  drawTrendChart(prop, vals, maxVal);
}

function drawTrendChart(prop, vals, maxVal) {
  const canvas = document.getElementById('trend-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = 360;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const labels = {electronegativity:'Electronegativity',ionization:'1st Ionization Energy (kJ/mol)',atomicRadius:'Atomic Radius (pm)',meltingPoint:'Melting Point (°C)',density:'Density (g/cm³)',examRelevance:'Exam Relevance (%)'};
  ctx.fillStyle = getComputedStyle(document.body).color;
  ctx.font = '20px system-ui';
  ctx.fillText(labels[prop] || prop, 10, 25);
  // Bar chart for first 36 elements
  const showCount = Math.min(36, ELEMENTS.length);
  const barW = (canvas.width - 60) / showCount;
  const chartH = canvas.height - 60;
  for (let i = 0; i < showCount; i++) {
    const v = vals[i];
    const h = maxVal > 0 ? (v / maxVal) * chartH : 0;
    const x = 40 + i * barW;
    const hue = (v / maxVal) * 270;
    ctx.fillStyle = `hsl(${270 - hue}, 80%, 60%)`;
    ctx.fillRect(x, chartH + 40 - h, barW - 2, h);
    ctx.fillStyle = getComputedStyle(document.body).color;
    ctx.font = '10px system-ui';
    ctx.save();
    ctx.translate(x + barW / 2, chartH + 55);
    ctx.rotate(-0.5);
    ctx.fillText(ELEMENTS[i].sym, 0, 0);
    ctx.restore();
  }
}

// ========== QUIZ MODE ==========
let quizState = { questions: [], current: 0, score: 0, answered: false };

function startQuiz() {
  const shuffled = [...EXAM_QUESTIONS].filter(q => q.type === 'mcq').sort(() => Math.random() - 0.5).slice(0, 20);
  quizState = { questions: shuffled, current: 0, score: 0, answered: false };
  document.getElementById('quiz-overlay').classList.add('active');
  showQuizQuestion();
}

function showQuizQuestion() {
  const box = document.getElementById('quiz-box');
  if (quizState.current >= quizState.questions.length) {
    const pct = Math.round((quizState.score / quizState.questions.length) * 100);
    let grade = pct >= 90 ? 'A*' : pct >= 80 ? 'A' : pct >= 70 ? 'B' : pct >= 60 ? 'C' : pct >= 50 ? 'D' : 'U';
    box.innerHTML = `
      <div class="quiz-score">
        <h2>Quiz Complete!</h2>
        <div class="score-num">${quizState.score}/${quizState.questions.length}</div>
        <p style="font-size:18px;margin:10px 0">Grade: <strong>${grade}</strong> (${pct}%)</p>
        <p style="color:var(--text2);margin-bottom:20px">${pct >= 70 ? 'Excellent work! Keep revising!' : pct >= 50 ? 'Good effort! Review the topics you got wrong.' : 'Keep practising! Focus on the explanations.'}</p>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary" onclick="startQuiz()">Try Again</button>
          <button class="btn btn-secondary" onclick="closeQuiz()">Close</button>
        </div>
      </div>`;
    return;
  }
  const q = quizState.questions[quizState.current];
  quizState.answered = false;
  const progress = ((quizState.current) / quizState.questions.length * 100);
  box.innerHTML = `
    <div class="quiz-progress">
      <span>Question ${quizState.current + 1} of ${quizState.questions.length}</span>
      <span>Score: ${quizState.score}</span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress}%"></div></div>
    <div class="quiz-topic">${q.topic} | ${q.marks} mark${q.marks>1?'s':''} | ${q.prob}% exam probability</div>
    <div class="quiz-question">${q.q}</div>
    <div class="quiz-options">
      ${q.opts.map((o, i) => `<button class="quiz-option" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}
    </div>
    <div class="quiz-explanation" id="quiz-exp">${q.explanation}</div>
    <div class="quiz-actions" id="quiz-actions" style="display:none">
      <button class="btn btn-primary" onclick="nextQuestion()">Next Question</button>
    </div>`;
}

function answerQuiz(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.current];
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === q.correct) opt.classList.add('correct');
    if (i === idx && idx !== q.correct) opt.classList.add('wrong');
  });
  if (idx === q.correct) quizState.score++;
  document.getElementById('quiz-exp').classList.add('show');
  document.getElementById('quiz-actions').style.display = 'flex';
}

function nextQuestion() {
  quizState.current++;
  showQuizQuestion();
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('active');
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeQuiz();
  }
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('quiz-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('quiz-overlay')) closeQuiz();
});

// ========== INIT ==========
initTable();
buildLegend();
buildCatFilters();
</script>
